# Apply once, out of band: kubectl apply -f deploy/k8s/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omiyage-frontend-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omiyage-frontend-deployer-binding
  namespace: default
subjects:
  - kind: Group
    name: "gitlab:ci_job:tcg/omiyage-frontend"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: omiyage-frontend-deployer
  apiGroup: rbac.authorization.k8s.io
