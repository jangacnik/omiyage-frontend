# NodePort - reachable on the LAN at http://<any-k8s-node-ip>:30083/
apiVersion: v1
kind: Service
metadata:
  name: omiyage-frontend
  labels:
    app: omiyage-frontend
spec:
  type: NodePort
  selector:
    app: omiyage-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30083
