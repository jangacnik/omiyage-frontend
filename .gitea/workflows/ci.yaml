name: ci
on:
  push:
    branches: ['**']
env:
  REGISTRY: gitea.gacnikhome.duckdns.org
  IMAGE: gitea.gacnikhome.duckdns.org/tcg/omiyage-frontend
jobs:
  test:
    runs-on: host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/w -w /w node:22.12-alpine sh -c "npm ci && npm run lint && npm run test:coverage && npm run build"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-${{ github.run_number }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce 80% coverage on changed lines
        run: |
          git fetch -q origin master
          git diff origin/master...HEAD > pr.diff
          docker run --rm -v "$PWD":/w -w /w python:3.13-alpine sh -c "apk add -q git && git config --global --add safe.directory /w && pip install -q diff-cover && diff-cover coverage/cobertura-coverage.xml --diff-file pr.diff --fail-under=80"
  build:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: Build and push image
        run: |
          echo "${{ secrets.CI_TOKEN }}" | docker login "$REGISTRY" -u ci-bot --password-stdin
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          docker build --build-arg VITE_API_BASE_URL=https://omiyage-api.gacnikhome.duckdns.org -f Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
      - name: Keep only the 5 newest local images
        run: |
          docker images "$IMAGE" --format '{{.ID}}' | awk '!seen[$0]++' | tail -n +6 | xargs -r docker rmi -f || true
          docker image prune -f
      - name: Bump image tag in homelab-gitops
        run: |
          TAG=$(echo "$GITHUB_SHA" | cut -c1-7)
          rm -rf gitops
          git clone "https://ci-bot:${{ secrets.CI_TOKEN }}@gitea.gacnikhome.duckdns.org/tcg/homelab-gitops.git" gitops
          cd gitops
          sed -i "s/newTag:.*/newTag: $TAG/" apps/omiyage-frontend/kustomization.yaml
          git -c user.name=ci-bot -c user.email=ci-bot@gacnikhome.duckdns.org commit -qam "omiyage-frontend: $TAG"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 3; done
